name: Unit test
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
        SQLITE_DB_LOCATION: ./db/todo.db
    steps:
        - uses: actions/checkout@v5
        - uses: actions/setup-node@v6
          with:
            node-version: 18
        - run: npm install
        - run: npm test
        

        